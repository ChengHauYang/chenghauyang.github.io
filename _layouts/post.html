<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page.title }} | Cheng-Hau Yang</title>
  <meta name="description" content="{{ page.excerpt | strip_html | strip }}">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">

  <!-- Open Graph / Social Preview -->
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{ page.title }} | Cheng-Hau Yang">
  <meta property="og:description" content="{{ page.excerpt | strip_html | strip }}">
  <meta property="og:url" content="https://chenghauyang.github.io{{ page.url }}">
  <meta property="og:image" content="https://chenghauyang.github.io/assets/img/ch-photo2.jpg">
  <meta name="twitter:card" content="summary">

  <!-- Fonts and Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Material+Icons&display=swap" />

  <!-- CSS Files -->
  <link rel="stylesheet" href="/assets/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/academicons.min.css">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/custom.css">

  <link rel="canonical" href="https://chenghauyang.github.io{{ page.url }}">

  <!-- Theme (must run before paint to avoid flash) -->
  <script>
    (function(){
      try {
        var saved = localStorage.getItem('theme');
        var preferred = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', saved || preferred);
      } catch(e){}
    })();
    document.addEventListener('DOMContentLoaded', function(){
      var btn = document.getElementById('themeToggle');
      if (!btn) return;
      btn.addEventListener('click', function(){
        var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch(e){}
      });
    });
  </script>
</head>

<body>

<!-- NAVBAR -->
<nav id="navbar" class="navbar fixed-top navbar-expand-md grey lighten-5 z-depth-1 navbar-light">
  <div class="container-fluid p-0">

    <a class="navbar-brand title font-weight-lighter" href="/"><span class="font-weight-bold">Cheng-Hau</span> Yang</a>

    <div class="d-flex align-items-center ml-auto">
      <button type="button" id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun"  viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
    </div>

    <div class="collapse navbar-collapse text-right" id="navbarNav">
      <ul class="navbar-nav ml-auto flex-nowrap">
        <li class="nav-item"><a class="nav-link" href="/">about</a></li>
        <li class="nav-item"><a class="nav-link" href="/cv/">cv</a></li>
        <li class="nav-item"><a class="nav-link" href="/projects/">projects</a></li>
        <li class="nav-item"><a class="nav-link" href="/publications/">publications</a></li>
      </ul>
    </div>

  </div>
</nav>

<!-- Scrolling Progress Bar -->
<progress id="progress" value="0">
  <div class="progress-container">
    <span class="progress-bar"></span>
  </div>
</progress>

<!-- MAIN CONTENT WRAPPER -->
<div class="content container mt-5 pt-4">

  <h1 class="title font-weight-bold text-center">{{ page.title }}</h1>

  {% if page.date %}
  <p class="text-center text-muted">{{ page.date | date: "%B %d, %Y" }}</p>
  {% endif %}

  <hr>

  <div class="post-content mt-4">
    {{ content }}
  </div>

</div>

<!-- FOOTER -->
<footer class="text-center mt-5 mb-3">
  &copy; Copyright <span id="footer-year"></span> Cheng-Hau Yang.
</footer>
<script>document.getElementById('footer-year').textContent = new Date().getFullYear();</script>

<!-- JavaScript -->
<script src="/assets/js/jquery.min.js"></script>
<script src="/assets/js/popper.min.js"></script>
<script src="/assets/js/bootstrap.min.js"></script>
<script src="/assets/js/mdb.min.js"></script>

<!-- Scrolling Progress Bar -->
<script type="text/javascript">
  $(document).ready(function () {
    var navbarHeight = $('#navbar').outerHeight(true);
    $('body').css({ 'padding-top': navbarHeight });
    $('.progress-container').css({ 'padding-top': navbarHeight });
    var progressBar = $('#progress');
    progressBar.css({ 'top': navbarHeight });
    var getMax = function () { return $(document).height() - $(window).height(); };
    var getValue = function () { return $(window).scrollTop(); };
    if ('max' in document.createElement('progress')) {
      progressBar.attr({ max: getMax() });
      progressBar.attr({ value: getValue() });
      $(document).on('scroll', function () {
        progressBar.attr({ value: getValue() });
      });
      $(window).resize(function () {
        var navbarHeight = $('#navbar').outerHeight(true);
        $('body').css({ 'padding-top': navbarHeight });
        $('.progress-container').css({ 'padding-top': navbarHeight });
        progressBar.css({ 'top': navbarHeight });
        progressBar.attr({ max: getMax(), value: getValue() });
      });
    }
  });
</script>

</body>
</html>
